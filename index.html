<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineup Builder v6 - GK Stats</title>
<style>
  body { font-family: -apple-system, Arial; max-width: 100%; margin: 0; padding: 10px; background: #1a1a1a; color: #eee; }
  h1, h2 { color: #3498db; font-size: 1.4rem; }
.container { background: #2c2c2c; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  input, select, button { padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #555; background: #333; color: #eee; font-size: 16px; width: 100%; box-sizing: border-box; }
  button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
  button:active { background: #2980b9; transform: scale(0.98); }
  button.secondary { background: #7f8c8d; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.player-card { background: #3a3a3a; padding: 12px; border-radius: 8px; margin: 8px 0; border: 2px solid transparent; }
.player-card.selected { border-color: #3498db; background: #2c4a6b; }
.player-card:active { transform: scale(0.98); }
.pitch { background: linear-gradient(#2ecc71, #27ae60); height: 500px; position: relative; border-radius: 12px; margin-top: 10px; border: 3px solid white; overflow: hidden; }
.position-slot { position: absolute; background: rgba(52, 73, 94, 0.95); color: white; padding: 6px; border-radius: 10px; font-size: 10px; transform: translate(-50%, -50%); text-align: center; min-width: 70px; min-height: 65px; border: 2px dashed #95a5a6; display: flex; flex-direction: column; justify-content: center; }
.position-slot.filled { background: #34495e; border: 2px solid #3498db; }
.position-slot.selected { background: #e74c3c; border-color: #c0392b; }
.pos-label { font-weight: bold; color: #f1c40f; display: block; margin-bottom: 2px; font-size: 11px; }
.ovr { font-weight: bold; color: #e67e22; }
.ovr.bad { color: #e74c3c; }
.flex { display: flex; gap: 10px; flex-wrap: wrap; }
.col { flex: 1; min-width: 100%; }
.hint { font-size: 12px; color: #95a5a6; margin-top: 5px; }
.hidden { display: none; }
@media (min-width: 768px) {
.col { min-width: 300px; }
.stat-grid { grid-template-columns: repeat(3, 1fr); }
.pitch { height: 600px; }
.position-slot { font-size: 11px; min-width: 80px; }
}
</style>
</head>
<body>

<h1>Lineup Builder v6 ⚽</h1>

<div class="container">
  <h2>1. Create Player</h2>
  <div class="flex">
    <input id="pName" placeholder="Player Name" style="flex: 2;">
    <select id="pPos" style="flex: 1;" onchange="toggleStatType()">
      <option value="GK">GK</option>
      <option value="CB">CB</option>
      <option value="LB">LB</option>
      <option value="RB">RB</option>
      <option value="LWB">LWB</option>
      <option value="RWB">RWB</option>
      <option value="CDM">CDM</option>
      <option value="CM">CM</option>
      <option value="LM">LM</option>
      <option value="RM">RM</option>
      <option value="CAM">CAM</option>
      <option value="LW">LW</option>
      <option value="RW">RW</option>
      <option value="ST">ST</option>
    </select>
  </div>

  <div id="outfieldStats" class="stat-grid">
    <input id="pPace" type="number" placeholder="PAC" min="1" max="99">
    <input id="pShoot" type="number" placeholder="SHO" min="1" max="99">
    <input id="pPass" type="number" placeholder="PAS" min="1" max="99">
    <input id="pDrib" type="number" placeholder="DRI" min="1" max="99">
    <input id="pDef" type="number" placeholder="DEF" min="1" max="99">
    <input id="pPhys" type="number" placeholder="PHY" min="1" max="99">
  </div>

  <div id="gkStats" class="stat-grid hidden">
    <input id="pDiv" type="number" placeholder="DIV" min="1" max="99">
    <input id="pHan" type="number" placeholder="HAN" min="1" max="99">
    <input id="pKic" type="number" placeholder="KIC" min="1" max="99">
    <input id="pRef" type="number" placeholder="REF" min="1" max="99">
    <input id="pSpd" type="number" placeholder="SPD" min="1" max="99">
    <input id="pPos" type="number" placeholder="POS" min="1" max="99">
  </div>

  <button onclick="createPlayer()">Add Player to Pool</button>
</div>

<div class="container">
  <h2>2. Team Settings</h2>
  <select id="formation" onchange="changeFormation()">
    <option value="4-4-2">4-4-2</option>
    <option value="4-3-3">4-3-3</option>
    <option value="3-5-2">3-5-2</option>
    <option value="4-2-3-1">4-2-3-1</option>
    <option value="5-3-2">5-3-2</option>
    <option value="4-1-2-1-2">4-1-2 Diamond</option>
    <option value="3-4-3">3-4-3</option>
    <option value="5-4-1">5-4-1</option>
    <option value="4-5-1">4-5-1</option>
    <option value="3-1-3-1">3-1-3-1</option>
  </select>
  <div class="flex">
    <input id="subCount" type="number" value="5" min="0" max="12" placeholder="Subs">
    <button onclick="clearLineup()" class="secondary">Clear XI</button>
    <button onclick="clearSubs()" class="secondary">Clear Subs</button>
  </div>
</div>

<div class="container">
  <h2>3. Starting XI - Tap slot to place/remove</h2>
  <div class="hint">Mobile: Tap player, then tap position. Desktop: Drag works too</div>
  <div id="pitch" class="pitch"></div>
</div>

<div class="flex">
  <div class="container col">
    <h2>Player Pool</h2>
    <div class="hint">Tap to select, then tap pitch position</div>
    <div id="playerPool"></div>
  </div>

  <div class="container col">
    <h2>Substitutes</h2>
    <div id="subs"></div>
  </div>
</div>

<script>
let players = [];
let lineup = Array(11).fill(null);
let subs = [];
let selectedPlayerId = null;

const formationPositions = {
  "4-4-2": ["GK","LB","CB","CB","RB","LM","CM","CM","RM","ST","ST"],
  "4-3-3": ["GK","LB","CB","CB","RB","CM","CM","CM","LW","ST","RW"],
  "3-5-2": ["GK","LCB","CB","RCB","LWB","CM","CM","CM","RWB","ST","ST"],
  "4-2-3-1": ["GK","LB","CB","CB","RB","CDM","CDM","LM","CAM","RM","ST"],
  "5-3-2": ["GK","LWB","LCB","CB","RCB","RWB","CM","CM","CM","ST","ST"],
  "4-1-2-1-2": ["GK","LB","CB","CB","RB","CDM","LM","RM","CAM","ST","ST"],
  "3-4-3": ["GK","LCB","CB","RCB","LM","CM","CM","RM","LW","ST","RW"],
  "5-4-1": ["GK","LWB","LCB","CB","RCB","RWB","LM","CM","CM","RM","ST"],
  "4-5-1": ["GK","LB","CB","CB","RB","LM","CM","CM","CM","RM","ST"],
  "3-1-3-1": ["GK","LB","CB","RB","CDM","LM","CM","RM","CAM","ST","CM"]
};

const formationCoords = {
  "4-4-2": [{top: "92%", left: "50%"}, {top: "72%", left: "15%"}, {top: "72%", left: "38%"}, {top: "72%", left: "62%"}, {top: "72%", left: "85%"}, {top: "45%", left: "15%"}, {top: "45%", left: "38%"}, {top: "45%", left: "62%"}, {top: "45%", left: "85%"}, {top: "20%", left: "35%"}, {top: "20%", left: "65%"}],
  "4-3-3": [{top: "92%", left: "50%"}, {top: "72%", left: "15%"}, {top: "72%", left: "38%"}, {top: "72%", left: "62%"}, {top: "72%", left: "85%"}, {top: "50%", left: "30%"}, {top: "50%", left: "50%"}, {top: "50%", left: "70%"}, {top: "22%", left: "20%"}, {top: "15%", left: "50%"}, {top: "22%", left: "80%"}],
  "3-5-2": [{top: "92%", left: "50%"}, {top: "72%", left: "25%"}, {top: "72%", left: "50%"}, {top: "72%", left: "75%"}, {top: "48%", left: "10%"}, {top: "48%", left: "32%"}, {top: "48%", left: "50%"}, {top: "48%", left: "68%"}, {top: "48%", left: "90%"}, {top: "20%", left: "35%"}, {top: "20%", left: "65%"}],
  "4-2-3-1": [{top: "92%", left: "50%"}, {top: "72%", left: "15%"}, {top: "72%", left: "38%"}, {top: "72%", left: "62%"}, {top: "72%", left: "85%"}, {top: "58%", left: "35%"}, {top: "58%", left: "65%"}, {top: "38%", left: "20%"}, {top: "38%", left: "50%"}, {top: "38%", left: "80%"}, {top: "12%", left: "50%"}],
  "5-3-2": [{top: "92%", left: "50%"}, {top: "72%", left: "10%"}, {top: "72%", left: "30%"}, {top: "72%", left: "50%"}, {top: "72%", left: "70%"}, {top: "72%", left: "90%"}, {top: "48%", left: "30%"}, {top: "48%", left: "50%"}, {top: "48%", left: "70%"}, {top: "20%", left: "35%"}, {top: "20%", left: "65%"}],
  "4-1-2-1-2": [{top: "92%", left: "50%"}, {top: "72%", left: "15%"}, {top: "72%", left: "38%"}, {top: "72%", left: "62%"}, {top: "72%", left: "85%"}, {top: "60%", left: "50%"}, {top: "47%", left: "30%"}, {top: "47%", left: "70%"}, {top: "34%", left: "50%"}, {top: "15%", left: "35%"}, {top: "15%", left: "65%"}],
  "3-4-3": [{top: "92%", left: "50%"}, {top: "72%", left: "25%"}, {top: "72%", left: "50%"}, {top: "72%", left: "75%"}, {top: "50%", left: "15%"}, {top: "50%", left: "38%"}, {top: "50%", left: "62%"}, {top: "50%", left: "85%"}, {top: "22%", left: "25%"}, {top: "15%", left: "50%"}, {top: "22%", left: "75%"}],
  "5-4-1": [{top: "92%", left: "50%"}, {top: "72%", left: "10%"}, {top: "72%", left: "30%"}, {top: "72%", left: "50%"}, {top: "72%", left: "70%"}, {top: "72%", left: "90%"}, {top: "48%", left: "20%"}, {top: "48%", left: "40%"}, {top: "48%", left: "60%"}, {top: "48%", left: "80%"}, {top: "15%", left: "50%"}],
  "4-5-1": [{top: "92%", left: "50%"}, {top: "72%", left: "15%"}, {top: "72%", left: "38%"}, {top: "72%", left: "62%"}, {top: "72%", left: "85%"}, {top: "48%", left: "10%"}, {top: "48%", left: "30%"}, {top: "48%", left: "50%"}, {top: "48%", left: "70%"}, {top: "48%", left: "90%"}, {top: "15%", left: "50%"}],
  "3-1-3-1": [{top: "92%", left: "50%"}, {top: "74%", left: "20%"}, {top: "74%", left: "50%"}, {top: "74%", left: "80%"}, {top: "62%", left: "50%"}, {top: "47%", left: "20%"}, {top: "47%", left: "50%"}, {top: "47%", left: "80%"}, {top: "30%", left: "50%"}, {top: "12%", left: "50%"}, {top: "47%", left: "10%"}]
};

const positionFamilies = {
  GK: ["GK"],
  CB: ["CB","LCB","RCB"],
  FB: ["LB","RB","LWB","RWB"],
  DM: ["CDM","CM"],
  AM: ["CAM","CM","LM","RM"],
  W: ["LW","RW","LM","RM"],
  ST: ["ST","CF"]
};

function toggleStatType() {
  const pos = document.getElementById('pPos').value;
  const outfield = document.getElementById('outfieldStats');
  const gk = document.getElementById('gkStats');
  if (pos === 'GK') {
    outfield.classList.add('hidden');
    gk.classList.remove('hidden');
  } else {
    outfield.classList.remove('hidden');
    gk.classList.add('hidden');
  }
}

function getPositionFamily(pos) {
  for (let fam in positionFamilies) {
    if (positionFamilies[fam].includes(pos)) return fam;
  }
  return pos;
}

function calcOVR(p, targetPos = null) {
  let stats;
  if (p.pos === 'GK') {
    stats = [+p.div, +p.han, +p.kic, +p.ref, +p.spd, +p.posStat];
  } else {
    stats = [+p.pace, +p.shoot, +p.pass, +p.drib, +p.def, +p.phys];
  }
  let base = Math.round(stats.reduce((a,b) => a+b, 0) / 6);

  if (!targetPos ||!p.pos) return base;
  if (p.pos === targetPos) return base;
  if (p.pos === 'GK' || targetPos === 'GK') return Math.max(base - 15, 40);
  if (getPositionFamily(p.pos) === getPositionFamily(targetPos)) return Math.max(base - 3, 40);
  return Math.max(base - 10, 40);
}

function createPlayer() {
  const name = document.getElementById('pName').value;
  const pos = document.getElementById('pPos').value;
  if (!name) return alert("Enter a name");

  let player = {name, pos, id: Date.now()};

  if (pos === 'GK') {
    player.div = document.getElementById('pDiv').value || 50;
    player.han = document.getElementById('pHan').value || 50;
    player.kic = document.getElementById('pKic').value || 50;
    player.ref = document.getElementById('pRef').value || 50;
    player.spd = document.getElementById('pSpd').value || 50;
    player.posStat = document.getElementById('pPos').value || 50;
  } else {
    player.pace = document.getElementById('pPace').value || 50;
    player.shoot = document.getElementById('pShoot').value || 50;
    player.pass = document.getElementById('pPass').value || 50;
    player.drib = document.getElementById('pDrib').value || 50;
    player.def = document.getElementById('pDef').value || 50;
    player.phys = document.getElementById('pPhys').value || 50;
  }

  players.push(player);
  updatePlayerPool();
  document.getElementById('pName').value = '';
  document.querySelectorAll('#outfieldStats input, #gkStats input').forEach(i => i.value = '');
}

function formatStats(p) {
  if (p.pos === 'GK') {
    return `DIV:${p.div} HAN:${p.han} KIC:${p.kic} REF:${p.ref} SPD:${p.spd} POS:${p.posStat}`;
  } else {
    return `PAC:${p.pace} SHO:${p.shoot} PAS:${p.pass} DRI:${p.drib} DEF:${p.def} PHY:${p.phys}`;
  }
}

function updatePlayerPool() {
  const pool = document.getElementById('playerPool');
  pool.innerHTML = '';
  players.forEach(p => {
    if (lineup.some(l => l && l.id === p.id) || subs.some(s => s.id === p.id)) return;
    const ovr = calcOVR(p);
    const card = document.createElement('div');
    card.className = 'player-card';
    if (selectedPlayerId === p.id) card.classList.add('selected');
    card.dataset.id = p.id;
    card.innerHTML = `<strong>${p.name}</strong> - ${p.pos} <span class="ovr">${ovr}</span><br>
      <small>${formatStats(p)}</small>
      <button onclick="addToSubs(${p.id})" style="margin-top:5px; padding:8px;">Add to Subs</button>`;
    card.addEventListener('click', () => selectPlayer(p.id));
    pool.appendChild(card);
  });
}

function selectPlayer(id) {
  selectedPlayerId = selectedPlayerId === id? null : id;
  updatePlayerPool();
  updatePitch();
}

function changeFormation() {
  lineup = Array(11).fill(null);
  updatePitch();
}

function updatePitch() {
  const pitch = document.getElementById('pitch');
  pitch.innerHTML = '';
  const form = document.getElementById('formation').value;
  const positions = formationPositions;
  const coords = formationCoords;

  positions.forEach((pos, i) => {
    const slot = document.createElement('div');
    slot.className = 'position-slot';
    if (lineup[i]) slot.classList.add('filled');
    if (selectedPlayerId &&!lineup[i]) slot.classList.add('selected');
    slot.style.top = coords[i].top;
    slot.style.left = coords[i].left;
    slot.dataset.index = i;
    slot.dataset.pos = pos;
    slot.addEventListener('click', () => handleSlotClick(i));

    const player = lineup[i];
    if (player) {
      const ovr = calcOVR(player, pos);
      const isBad = ovr < calcOVR(player) - 5;
      slot.innerHTML = `<span class="pos-label">${pos}</span>${player.name}<br><span class="ovr ${isBad?'bad':''}">${ovr}</span>`;
    } else {
      slot.innerHTML = `<span class="pos-label">${pos}</span>Tap`;
    }
    pitch.appendChild(slot);
  });
}

function handleSlotClick(index) {
  if (lineup[index]) {
    lineup[index] = null;
  } else if (selectedPlayerId) {
    const player = players.find(p => p.id === selectedPlayerId);
    if (player) {
      subs = subs.filter(s => s.id!== selectedPlayerId);
      lineup = lineup.map(p => p && p.id === selectedPlayerId? null : p);
      lineup[index] = player;
      selectedPlayerId = null;
    }
  }
  updatePitch();
  updatePlayerPool();
  updateSubsDisplay();
}

function addToSubs(playerId) {
  const maxSubs = parseInt(document.getElementById('subCount').value);
  if (subs.length >= maxSubs) return alert(`Max ${maxSubs} subs`);
  const player = players.find(p => p.id === playerId);
  if (!player || subs.some(s => s.id === playerId) || lineup.some(p => p && p.id === playerId)) return;
  subs.push(player);
  selectedPlayerId = null;
  updateSubsDisplay();
  updatePlayerPool();
}

function removeSub(index) {
  subs.splice(index, 1);
  updateSubsDisplay();
  updatePlayerPool();
}

function updateSubsDisplay() {
  const subsDiv = document.getElementById('subs');
  subsDiv.innerHTML = '';
  subs.forEach((s, i) => {
    const ovr = calcOVR(s);
    const card = document.createElement('div');
    card.className = 'player-card';
    card.innerHTML = `<strong>${s.name}</strong> - ${s.pos} <span class="ovr">${ovr}</span><br>
      <small>${formatStats(s)}</small>
      <button onclick="removeSub(${i})" style="margin-top:5px; padding:8px;">Remove</button>`;
    subsDiv.appendChild(card);
  });
}

function clearLineup() {
  lineup = Array(11).fill(null);
  updatePitch();
  updatePlayerPool();
}

function clearSubs() {
  subs = [];
  updateSubsDisplay();
  updatePlayerPool();
}

updatePitch();
updatePlayerPool();
toggleStatType();
</script>

</body>
</html>
